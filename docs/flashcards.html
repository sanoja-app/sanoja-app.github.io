<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sanoja Flashcards</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://sanoja-app.github.io/flashcards.html" />
<link rel="icon" href="assets/icon128.png" />
<link rel="apple-touch-icon" href="assets/icon128.png" />
<link rel="manifest" href="flashcards.webmanifest" />
<meta name="theme-color" content="#2962ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sanoja" />
<style>
  :root {
    color-scheme: light;
    --page: #ffffff;
    --surface-alt: #f7f8fa;
    --text-primary: #0b0e14;
    --text-secondary: #57606f;
    --text-muted: #8a92a3;
    --gridline: #e7e9ee;
    --accent: #2962ff;
    --accent-dark: #1a3fd6;
    --accent-soft: #e8edff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--gridline);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .iconBtn {
    border: none;
    background: none;
    color: var(--text-secondary);
    padding: 6px;
    cursor: pointer;
    display: flex;
  }
  .iconBtn:active { color: var(--accent); }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 20px 0;
    flex-shrink: 0;
  }
  .filter {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--gridline);
    background: var(--page);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }

  [hidden] { display: none !important; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
    min-height: 0;
  }

  .progress { font-size: 12.5px; color: var(--text-muted); }

  .card {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 3 / 2;
    background: var(--surface-alt);
    border: 1px solid var(--gridline);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    cursor: pointer;
    user-select: none;
  }
  .card .word { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .card .lang { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }
  .card .context { font-size: 13.5px; font-weight: 400; font-style: italic; color: var(--text-secondary); margin-top: 10px; letter-spacing: normal; text-transform: none; }
  .card .hint { font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 14px; }
  .card.flipped { background: var(--accent-soft); border-color: var(--accent-soft); }
  .card.flipped .lang { color: var(--accent-dark); }

  .controls {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .roundBtnWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .roundBtnLabel { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
  .roundBtn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--gridline);
    background: var(--page);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .roundBtn:active { background: var(--surface-alt); }
  .roundBtn.primary { background: var(--accent); border-color: var(--accent); color: white; }

  .empty {
    text-align: center;
    max-width: 300px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty h2 { font-size: 18px; margin: 0 0 8px; color: var(--text-primary); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text-primary);
    color: white;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand"><img src="assets/icon128.png" alt="" />Flashcards</div>
  <button class="iconBtn" id="refreshBtn" aria-label="Refresh from extension" title="Refresh from extension">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M8 16H3v5"/></svg>
  </button>
</header>

<div class="filters" id="filters" hidden>
  <button class="filter active" data-filter="due">Due</button>
  <button class="filter" data-filter="all">All</button>
  <button class="filter" data-filter="mastered">Known</button>
</div>

<main id="main">
  <p class="progress" id="progress" hidden></p>
  <div id="cardArea"></div>
  <div class="controls" id="controls" hidden>
    <div class="roundBtnWrap">
      <button class="roundBtn" id="shuffleBtn" aria-label="Shuffle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21,16 21,21 16,21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <span class="roundBtnLabel">Shuffle</span>
    </div>
    <div class="roundBtnWrap">
      <button class="roundBtn primary" id="nextBtn" aria-label="Next word">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="roundBtnLabel">Next</span>
    </div>
    <div class="roundBtnWrap">
      <button class="roundBtn" id="masteredBtn" aria-label="Mark known">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,12.5 9,17.5 20,6"/></svg>
      </button>
      <span class="roundBtnLabel">Know it</span>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="flashcards.js"></script>
</body>
</html>
